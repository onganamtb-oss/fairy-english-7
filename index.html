
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairy English 7</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f0ff;color:#30234b}
header{background:#7554b8;color:white;text-align:center;padding:22px}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #ddd}
button{border:0;border-radius:12px;padding:12px 16px;background:#7957c7;color:white;font-size:16px;margin:5px;cursor:pointer}
.option{display:block;width:100%;text-align:left;background:#eee8fa;color:#30234b}
small{color:#715c91}
</style>
</head>
<body>
<header>
<h1>🧚 Fairy English 7</h1>
<p>Học tiếng Anh cùng nàng tiên!</p>
<div>⭐ XP: <span id="xp">0</span>　🪙 Xu: <span id="coins">0</span></div>
</header>
<main>
<div class="card">
<h2>🏰 Khu rừng từ vựng</h2>
<p>Chọn một chủ đề để bắt đầu hành trình.</p>
<button onclick="start(0)">🍽️ Food and Drink</button>
<button onclick="start(1)">🏠 My Home</button>
<button onclick="start(2)">🎒 School</button>
</div>
<div class="card" id="game">
<h2>📖 Nhiệm vụ hôm nay</h2>
<p>Học từ mới, nghe phát âm và trả lời câu hỏi để nhận XP!</p>
<button onclick="start(0)">Bắt đầu học ✨</button>
</div>
<div class="card">
<h3>🎒 Túi đồ của bạn</h3>
<p id="rank">Danh hiệu: Người học mới</p>
<p id="items">Chưa có vật phẩm.</p>
</div>
</main>
<script>
const words=[
[
{en:"vegetable",vi:"rau củ",ex:"I eat vegetables every day.",q:"Vegetable nghĩa là gì?",a:["Rau củ","Thịt","Nước"],c:0},
{en:"delicious",vi:"ngon",ex:"This soup is delicious.",q:"Delicious nghĩa là gì?",a:["Đắt tiền","Ngon","Lạnh"],c:1},
{en:"noodles",vi:"mì",ex:"I would like a bowl of noodles.",q:"Noodles nghĩa là gì?",a:["Cơm","Bánh mì","Mì"],c:2}
],
[
{en:"bedroom",vi:"phòng ngủ",ex:"My bedroom is small.",q:"Bedroom nghĩa là gì?",a:["Phòng khách","Phòng ngủ","Nhà bếp"],c:1},
{en:"comfortable",vi:"thoải mái",ex:"This chair is comfortable.",q:"Comfortable nghĩa là gì?",a:["Thoải mái","Ồn ào","Bẩn"],c:0}
],
[
{en:"library",vi:"thư viện",ex:"I read books in the library.",q:"Library nghĩa là gì?",a:["Sân chơi","Nhà ăn","Thư viện"],c:2},
{en:"uniform",vi:"đồng phục",ex:"We wear a school uniform.",q:"Uniform nghĩa là gì?",a:["Đồng phục","Bài tập","Bút chì"],c:0}
]
];
let xp=Number(localStorage.fairyXP||0),coins=Number(localStorage.fairyCoins||0),idx=0,topic=0;
function update(){
document.getElementById("xp").textContent=xp;
document.getElementById("coins").textContent=coins;
document.getElementById("rank").textContent="Danh hiệu: "+(xp>=100?"Pháp sư tiếng Anh 🧙":xp>=40?"Học trò phép thuật ✨":"Người học mới 🌱");
document.getElementById("items").textContent=xp>=40?"🪽 Đôi cánh tiên":"Tích lũy 40 XP để mở khóa đôi cánh tiên!";
localStorage.fairyXP=xp;localStorage.fairyCoins=coins;
}
function speak(t){
if(!("speechSynthesis" in window)){alert("Trình duyệt chưa hỗ trợ phát âm.");return}
speechSynthesis.cancel();
let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u);
}
function start(t){
topic=t;idx=0;showWord();
}
function showWord(){
let w=words[topic][idx%words[topic].length];
document.getElementById("game").innerHTML=
"<h2>✨ Từ mới "+(idx+1)+"</h2><h1>"+w.en+"</h1><p>🇻🇳 Nghĩa: "+w.vi+"</p><p>Ví dụ: "+w.ex+"</p>"+
'<button onclick="speak(\''+w.en+'\')">🔊 Nghe từ</button><button onclick="speak(\''+w.ex+'\')">🗣️ Nghe câu</button>'+
'<button onclick="quiz()">Làm câu hỏi ➜</button>';
}
function quiz(){
let w=words[topic][idx%words[topic].length];
let html="<h2>🧩 Thử thách</h2><p>"+w.q+"</p>";
w.a.forEach((a,i)=>{html+='<button class="option" onclick="answer('+i+')">'+a+'</button>'});
document.getElementById("game").innerHTML=html;
}
function answer(i){
let w=words[topic][idx%words[topic].length];
if(i===w.c){xp+=10;coins+=5;update();document.getElementById("game").innerHTML="<h2>🎉 Chính xác!</h2><p>+10 XP và +5 xu</p><button onclick='next()'>Tiếp tục ➜</button>"}
else{document.getElementById("game").innerHTML="<h2>🌱 Cố gắng nhé!</h2><p>Đáp án đúng: "+w.a[w.c]+"</p><button onclick='quiz()'>Thử lại</button><button onclick='next()'>Học từ tiếp theo</button>"}
}
function next(){idx++;showWord()}
update();
</script>
</body>
</html>
